{% extends "base.html" %}
{% block title %}Create Account{% endblock %}

{% block content %}
<div class="auth-card-wrapper">
    <div class="auth-card shadow-sm">
        <!-- Brand Header -->
        <div class="text-center mb-4">
            <div class="auth-brand-icon mx-auto mb-3">
                <i class="bi bi-person-plus-fill"></i>
            </div>
            <h3 class="fw-bold mb-1">Create your account</h3>
            <p class="text-muted small mb-0">Sign up to start screening resumes with AI skill matching.</p>
        </div>

        <!-- Registration Form -->
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Work Email</label>
                <div class="input-icon-group">
                    <i class="bi bi-envelope"></i>
                    <input type="email" name="email" class="form-control" placeholder="name@company.com" required autofocus>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Full Name or Username</label>
                <div class="input-icon-group">
                    <i class="bi bi-person"></i>
                    <input type="text" name="username" class="form-control" placeholder="e.g. Alex Hunter" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Password</label>
                <div class="input-icon-group">
                    <i class="bi bi-lock"></i>
                    <input type="password" name="password" class="form-control" placeholder="Minimum 4 characters" minlength="4" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                <span>Create Account</span>
                <i class="bi bi-arrow-right"></i>
            </button>
        </form>

        <!-- Footer Link -->
        <div class="text-center pt-3 border-top">
            <p class="text-muted small mb-0">
                Already have an account? 
                <a href="{{ url_for('login') }}" class="fw-semibold text-primary">Sign in</a>
            </p>
        </div>
    </div>

    <!-- Security Subtext -->
    <div class="text-center mt-3 text-muted small">
        <i class="bi bi-shield-check text-success me-1"></i> End-to-end encrypted &bull; Secure session
    </div>
</div>
{% endblock %}
