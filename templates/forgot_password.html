{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="auth-card-wrapper">
    <div class="auth-card shadow-sm">
        <!-- Brand Header -->
        <div class="text-center mb-4">
            <div class="auth-brand-icon mx-auto mb-3">
                <i class="bi bi-key-fill"></i>
            </div>
            <h3 class="fw-bold mb-1">Reset your password</h3>
            <p class="text-muted small mb-0">Enter your registered email to set a new password.</p>
        </div>

        <!-- Password Reset Form -->
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Registered Email</label>
                <div class="input-icon-group">
                    <i class="bi bi-envelope"></i>
                    <input type="email" name="email" class="form-control" placeholder="name@company.com" required autofocus>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">New Password</label>
                <div class="input-icon-group">
                    <i class="bi bi-lock"></i>
                    <input type="password" name="new_password" class="form-control" placeholder="Minimum 4 characters" minlength="4" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Confirm New Password</label>
                <div class="input-icon-group">
                    <i class="bi bi-lock-fill"></i>
                    <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter new password" minlength="4" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                <span>Update Password</span>
                <i class="bi bi-arrow-right"></i>
            </button>
        </form>

        <!-- Footer Link -->
        <div class="text-center pt-3 border-top">
            <p class="text-muted small mb-0">
                Remember your password? 
                <a href="{{ url_for('login') }}" class="fw-semibold text-primary">Back to sign in</a>
            </p>
        </div>
    </div>

    <!-- Security Subtext -->
    <div class="text-center mt-3 text-muted small">
        <i class="bi bi-shield-check text-success me-1"></i> End-to-end encrypted &bull; Secure session
    </div>
</div>
{% endblock %}
