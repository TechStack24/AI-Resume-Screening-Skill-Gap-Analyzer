{% extends "base.html" %}
{% block title %}Sign In{% endblock %}

{% block content %}
<div class="auth-card-wrapper">
    <div class="auth-card shadow-sm">
        <!-- Brand Header -->
        <div class="text-center mb-4">
            <div class="auth-brand-icon mx-auto mb-3">
                <i class="bi bi-cpu-fill"></i>
            </div>
            <h3 class="fw-bold mb-1">Sign in to your account</h3>
            <p class="text-muted small mb-0">Enter your credentials to access your screening dashboard.</p>
        </div>

        <!-- Sign In Form -->
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Email or Username</label>
                <div class="input-icon-group">
                    <i class="bi bi-envelope"></i>
                    <input type="text" name="email" class="form-control" placeholder="name@company.com" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label mb-0">Password</label>
                    <a href="{{ url_for('forgot_password') }}" class="small text-primary fw-semibold text-decoration-none">Forgot password?</a>
                </div>
                <div class="input-icon-group">
                    <i class="bi bi-lock"></i>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                <span>Sign In</span>
                <i class="bi bi-arrow-right"></i>
            </button>
        </form>

        <!-- Footer Link -->
        <div class="text-center pt-3 border-top">
            <p class="text-muted small mb-0">
                Don't have an account? 
                <a href="{{ url_for('register') }}" class="fw-semibold text-primary">Create an account</a>
            </p>
        </div>
    </div>

    <!-- Security Subtext -->
    <div class="text-center mt-3 text-muted small">
        <i class="bi bi-shield-check text-success me-1"></i> End-to-end encrypted &bull; Secure session
    </div>
</div>
{% endblock %}
